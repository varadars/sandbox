<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Details</title>
    <link rel="stylesheet" href="group.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="back-link">← Back to Groups</a>
            <h1 id="group-name">Group Name</h1>
            <button id="add-member-btn">+ Add Member</button>
        </header>
        
        <main>
            <section class="leaderboard-section">
                <h2>Leaderboard</h2>
                <br>
                <div class="leaderboard-container">
                    <table id="leaderboard">
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Name</th>
                                <th>Points</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body">
                            <!-- Leaderboard data will be added here -->
                        </tbody>
                    </table>
                </div>
            </section>
            
            <section class="members-section">
                <h2>Group Members</h2>
                <br>
                <div id="members-container" class="members-grid">
                    <!-- Member cards will be added here -->
                </div>
            </section>
        </main>
    </div>
    
    <!-- Add Member Modal -->
    <div id="add-member-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add New Member</h2>
            <form id="add-member-form">
                <div class="form-group">
                    <label for="member-name">Name:</label>
                    <input type="text" id="member-name" required>
                </div>
                <div class="form-group">
                    <label for="member-profession">Profession:</label>
                    <input type="text" id="member-profession" required>
                </div>
                <div class="form-group">
                    <label for="member-image">Profile Image URL (optional):</label>
                    <input type="text" id="member-image" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label for="member-password">Password:</label>
                    <input type="password" id="member-password" required>
                </div>
                <button type="submit">Add Member</button>
            </form>
        </div>
    </div>

    <script src="group.js"></script>
</body>
</html>
