<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker - Groups</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Habit Tracker Groups</h1>
            <button id="add-group-btn">+ Add Group</button>
        </header>
        
        <main>
            <div id="groups-container" class="groups-grid">
                <!-- Groups will be dynamically added here -->
            </div>
        </main>
    </div>

    <!-- Add Group Modal -->
    <div id="add-group-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add New Group</h2>
            <form id="add-group-form">
                <div class="form-group">
                    <label for="group-name">Group Name:</label>
                    <input type="text" id="group-name" required>
                </div>
                <div class="form-group">
                    <label for="group-image">Group Image URL (optional):</label>
                    <input type="text" id="group-image" placeholder="https://...">
                </div>
                <button type="submit">Create Group</button>
            </form>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
