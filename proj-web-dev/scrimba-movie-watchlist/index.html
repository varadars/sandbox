<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <title>Movie Watchlist</title>
</head>
<body>
    <header>
        <h1>watchlist</h1>
    </header>
    <main>
        <div class="tabs">
            <button class="tab selected" data-page="page-1">search</button>
            <button class="tab" data-page="page-2">watchlist</button>
            <button class="tab" data-page="page-3">favorites</button>
        </div>
        <div class="pages">
            <div id="page-1" class="page">
                <input id="search-watchlist" class="search" type="text" placeholder="legend" value="legend">
                <div id="search-results" class="search-results">
                    
                </div>
            </div>
            <div id="page-2" class="page hidden">
                <div id="watchlist" class="search-results">
              
                </div>
            </div>
            <div id="page-3" class="page hidden">
                <div id="favorites" class="search-results">
              
                </div>
            </div>
        </div>
    </main>
    <script type="module" src="index.js"></script>
</body>
</html>
