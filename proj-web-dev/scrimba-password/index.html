<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Password Generator</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="generator">
            <div id="popup">
            </div>
            <div class="header">
                <div id="theme-toggle">dark</div>
                <h1 id="title">Generate a <span class="green">random password</span></h1>
                <h2 id="subtitle">Never use an insecure password again.</h2>
            </div>
            <button id="generate">Generate passwords</button>
            <div class="divider"></div>
            <div class="results">
                <div class="result">
                    <p class="result-text">egxWij@veiPUwK</p>
                </div>
                <div class="result">
                    <p class="result-text">>nfJjy!dDvR&ial</p>
                </div>
            </div>
        </div>
    </body>
    <script src="index.js"></script>
</html>
