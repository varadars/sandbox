<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="screen">
            <div id="new-game" class="button">
                New Game
            </div>
            <div class="board">
                <div id="home" class="section">
                    <div class="title">
                        <h2>HOME</h2>
                    </div>
                    <div class="score">
                        <h1 id="home-score" >6</h1>
                    </div>
                    <div id="home-buttons" class="buttons">
                        <div class="button">+1</div>
                        <div class="button">+2</div>
                        <div class="button">+3</div>
                    </div>
                </div>
                <div id="guest" class="section">
                    <div class="title">
                        <h2>GUEST</h2>
                    </div>
                    <div class="score">
                        <h1 id="guest-score">12</h1>
                    </div>
                    <div id="guest-buttons" class="buttons">
                        <div class="button">+1</div>
                        <div class="button">+2</div>
                        <div class="button">+3</div>
                    </div>
                </div>
            </div>
        </div>
    </body>
    <script src="index.js"></script>
</html>
